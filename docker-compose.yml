version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: highpeak-db
    environment:
      POSTGRES_DB: ${DB_NAME:-highpeak}
      POSTGRES_USER: ${DB_USER:-highpeak_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-highpeak_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - highpeak-network

  app:
    build: .
    container_name: highpeak-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-highpeak_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-highpeak}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://peak.wisdombusara.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public/media:/app/public/media
    networks:
      - highpeak-network

  nginx:
    image: nginx:alpine
    container_name: highpeak-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - highpeak-network

volumes:
  postgres_data:

networks:
  highpeak-network:
    driver: bridge
