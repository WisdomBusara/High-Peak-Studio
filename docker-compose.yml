name: highpeak

# Values come from ./.env, which setup-highpeak.sh creates.
services:
  postgres:
    image: postgres:15-alpine
    container_name: highpeak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: highpeak
      POSTGRES_USER: highpeak_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - run setup-highpeak.sh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highpeak_user -d highpeak"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?SITE_URL is not set - run setup-highpeak.sh}
    image: highpeak-app
    container_name: highpeak-app
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: highpeak_user
      DB_NAME: highpeak
      DB_PASSWORD: ${DB_PASSWORD}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is not set - run setup-highpeak.sh}
      SITE_URL: ${SITE_URL}
    # Loopback only: cloudflared on the host is the only thing that should reach it.
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/chatbot/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  media:
